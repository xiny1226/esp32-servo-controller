<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Light Switch Controller</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f6fa;
      padding: 30px 15px;
    }

    button {
      padding: 18px 30px;
      margin: 8px;
      font-size: 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    #connect {
      background: #2176d2;
      color: white;
      font-size: 18px;
    }

    #on {
      background: #239b56;
      color: white;
    }

    #off {
      background: #d64040;
      color: white;
    }
  </style>
</head>

<body>
  <h2>Light Switch Controller</h2>

  <p id="status">Not connected</p>

  <button id="connect" onclick="connectBLE()">
    Connect Bluetooth
  </button>

  <p>
    <button id="on" onclick="sendAngle(30)" disabled>
      ON
    </button>

    <button id="off" onclick="sendAngle(150)" disabled>
      OFF
    </button>
  </p>

  <p id="command">No command sent yet</p>

  <script>
    const serviceUUID =
      "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

    const characteristicUUID =
      "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    let characteristic = null;

    function enableControls(enabled) {
      document.getElementById("on").disabled = !enabled;
      document.getElementById("off").disabled = !enabled;
    }

    async function connectBLE() {
      const connectButton = document.getElementById("connect");
      connectButton.disabled = true;

      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "Light Switch Controller" }],
          optionalServices: [serviceUUID]
        });

        device.addEventListener("gattserverdisconnected", () => {
          characteristic = null;
          enableControls(false);
          connectButton.disabled = false;

          document.getElementById("status").textContent =
            "Disconnected";
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(serviceUUID);

        characteristic = await service.getCharacteristic(
          characteristicUUID
        );

        document.getElementById("status").textContent =
          "Connected!";

        enableControls(true);
      } catch (error) {
        characteristic = null;
        enableControls(false);
        connectButton.disabled = false;

        document.getElementById("status").textContent =
          "Connection failed: " + error.message;
      }
    }

    async function sendAngle(angle) {
      if (!characteristic) {
        return;
      }

      enableControls(false);

      try {
        const data = new TextEncoder().encode(String(angle));

        await characteristic.writeValueWithResponse(data);

        document.getElementById("command").textContent =
          angle === 30
            ? "Last command: ON"
            : "Last command: OFF";
      } catch (error) {
        document.getElementById("command").textContent =
          "Failed to send command: " + error.message;
      } finally {
        enableControls(characteristic !== null);
      }
    }
  </script>
</body>
</html>
